<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Wall Clock</title>

<style>

/* GENERAL RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #142700;
    font-family: Arial, sans-serif;
}

/* CLOCK OUTER FRAME */

.clock {
    width: 350px;
    height: 350px;
    border-radius: 50%;
    padding: 8px;
    background: #050505;

    box-shadow:
        0 0 15px #00ff00,
        0 0 30px #00ff00,
        0 0 60px #008000;
}

/* CLOCK FACE */

.clock-face {
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 50%;
    position: relative;
    border: 3px solid #222;
}

/* MINUTE MARKINGS */

.markings {
    position: absolute;
    inset: 0;
    border-radius: 50%;
}

.marking {
    position: absolute;
    width: 2px;
    height: 7px;
    background: #333;
    left: 50%;
    top: 5px;
    transform-origin: 50% 160px;
}

/* HOUR MARKINGS */

.marking:nth-child(5n + 1) {
    width: 4px;
    height: 13px;
    background: #000;
}

/* NUMBERS */

.number {
    position: absolute;
    font-size: 23px;
    font-weight: bold;
    color: black;
}

.n12 {
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
}

.n1 {
    top: 38px;
    right: 77px;
}

.n2 {
    top: 83px;
    right: 34px;
}

.n3 {
    right: 17px;
    top: 50%;
    transform: translateY(-50%);
}

.n4 {
    bottom: 83px;
    right: 34px;
}

.n5 {
    bottom: 38px;
    right: 77px;
}

.n6 {
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
}

.n7 {
    bottom: 38px;
    left: 77px;
}

.n8 {
    bottom: 83px;
    left: 34px;
}

.n9 {
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
}

.n10 {
    top: 83px;
    left: 34px;
}

.n11 {
    top: 38px;
    left: 77px;
}

/* HANDS COMMON STYLE */

.hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 20px;
}

/* HOUR HAND */

.hour-hand {
    width: 8px;
    height: 75px;
    background: #111;
    z-index: 3;
    animation: hourMove 43200s linear infinite;
}

/* MINUTE HAND */

.minute-hand {
    width: 5px;
    height: 105px;
    background: #222;
    z-index: 4;
    animation: minuteMove 3600s linear infinite;
}

/* SECOND HAND */

.second-hand {
    width: 2px;
    height: 125px;
    background: red;
    z-index: 5;
    animation: secondMove 60s steps(60) infinite;
}

/* CENTRE POINT */

.center {
    width: 19px;
    height: 19px;
    background: #050505;
    border: 4px solid #00ff00;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    z-index: 10;
}

/* ANIMATIONS */

@keyframes secondMove {
    from {
        transform: translateX(-50%) rotate(0deg);
    }

    to {
        transform: translateX(-50%) rotate(360deg);
    }
}

@keyframes minuteMove {
    from {
        transform: translateX(-50%) rotate(0deg);
    }

    to {
        transform: translateX(-50%) rotate(360deg);
    }
}

@keyframes hourMove {
    from {
        transform: translateX(-50%) rotate(0deg);
    }

    to {
        transform: translateX(-50%) rotate(360deg);
    }
}

/* RESPONSIVE DESIGN */

@media (max-width: 400px) {

    .clock {
        width: 300px;
        height: 300px;
    }

    .marking {
        transform-origin: 50% 135px;
    }

    .number {
        font-size: 20px;
    }

}

</style>
</head>

<body>

<div class="clock">

    <div class="clock-face">

        <!-- MINUTE MARKINGS -->

        <div class="markings" id="markings"></div>

        <!-- NUMBERS -->

        <div class="number n12">12</div>
        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>

        <!-- CLOCK HANDS -->

        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>

        <!-- CENTRE -->

        <div class="center"></div>

    </div>

</div>

<script>

/* CREATE 60 MINUTE MARKINGS */

const markings = document.getElementById("markings");

for (let i = 0; i < 60; i++) {

    const mark = document.createElement("div");

    mark.classList.add("marking");

    mark.style.transform =
        `translateX(-50%) rotate(${i * 6}deg)`;

    markings.appendChild(mark);

}

</script>

</body>
</html>
